name: Deploy FLIXORA Supabase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure API secrets and deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          TASTEDIVE_API_KEY: ${{ secrets.TASTEDIVE_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF to GitHub Actions secrets."
            exit 1
          fi

          args=()
          for key in OMDB_API_KEY WATCHMODE_API_KEY TASTEDIVE_API_KEY TRAKT_CLIENT_ID; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              args+=("$key=$value")
            fi
          done

          if [ "${#args[@]}" -gt 0 ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"
          fi

          supabase functions deploy external-catalog --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy catalog-visibility --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy flixora-subtitles --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy flixora-notifications --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
