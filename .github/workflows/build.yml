
name: Build FLIXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Validate project
        run: |
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found"
            exit 1
          }

          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart not found"
            exit 1
          }

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=flixora --org=com.flixora .

      - name: Set Flixora App Name and Premium Icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          content = manifest.read_text()

          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="Flixora"',
              content,
              count=1
          )

          if 'android:icon=' in content:
              content = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  content,
                  count=1
              )
          else:
              content = content.replace(
                  '<application',
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          permission = 'android.permission.INTERNET'

          if permission not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1
              )

          manifest.write_text(content)

          res = Path("android/app/src/main/res")

          drawable = res / "drawable"
          adaptive = res / "mipmap-anydpi-v26"

          drawable.mkdir(parents=True, exist_ok=True)
          adaptive.mkdir(parents=True, exist_ok=True)

          (drawable / "ic_launcher_background.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#080808"/>
          </shape>
          """)

          (drawable / "ic_launcher_foreground.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#080808"
                  android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#D6AD45"
                  android:strokeWidth="2.5"
                  android:pathData="M54,12 A42,42 0,1 1,53.9 12"/>

              <path
                  android:fillColor="#D6AD45"
                  android:pathData="M31,24 H78 V36 H44 V47 H70 V59 H44 V84 H31 Z"/>
          </vector>
          """)

          (adaptive / "ic_launcher.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """)

          print("Flixora branding and launcher icon configured.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub deps

      - name: Analyze Flutter project
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIXORA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
