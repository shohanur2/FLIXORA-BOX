
name: Build FLIXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 4. Check environment
      - name: Check Flutter
        run: |
          flutter --version
          java -version
          flutter doctor -v

      # 5. Validate project
      - name: Validate project
        run: |
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found"
            exit 1
          }

          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart not found"
            exit 1
          }

      # 6. Generate Android project if missing
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            echo "Android folder missing. Generating Android project..."
            flutter create \
              --platforms=android \
              --project-name=flixora \
              --org=com.flixora .
          else
            echo "Android project already exists."
          fi

      # 7. Validate Android project
      - name: Validate Android project
        run: |
          test -f android/app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          }

      # 8. Configure app name and Internet permission
      - name: Configure Flixora Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="Flixora"',
              content,
              count=1
          )

          if 'android.permission.INTERNET' not in content:
              content = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  content,
                  count=1
              )

          manifest.write_text(content)

          print("Flixora Android configuration completed.")
          PY

      # 9. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 10. Verify dependencies
      - name: Verify dependencies
        run: flutter pub deps

      # 11. Analyze project
      - name: Analyze Flutter project
        continue-on-error: true
        run: flutter analyze --no-pub

      # 12. Build release APK
      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # 13. Verify APK
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIXORA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
