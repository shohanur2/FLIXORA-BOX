
name: Build FLIXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=flixora --org=com.flixora .

      - name: Ensure Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace('<application', f'    {permission}\n    <application', 1)
              p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: flutter build apk --release --dart-define=TMDB_API_KEY="$TMDB_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIXORA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
