
name: Build FLIXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter
        run: flutter doctor -v

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=flixora --org=com.flixora .

      - name: Set Flixora App Name and Premium Icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="Flixora"',
              content,
              count=1
          )

          if 'android:icon=' in content:
              content = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@mipmap/ic_launcher"',
                  content,
                  count=1
              )
          else:
              content = content.replace(
                  '<application',
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          permission = 'android.permission.INTERNET'
          if permission not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1
              )

          manifest.write_text(content)

          res = Path("android/app/src/main/res")

          drawable = res / "drawable"
          adaptive = res / "mipmap-anydpi-v26"

          drawable.mkdir(parents=True, exist_ok=True)
          adaptive.mkdir(parents=True, exist_ok=True)

          (drawable / "ic_launcher_background.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#080808"/>
          </shape>
          """)

          (drawable / "ic_launcher_foreground.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#080808"
                  android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#D6AD45"
                  android:strokeWidth="2.5"
                  android:pathData="M54,12 A42,42 0,1 1,53.9 12"/>

              <path
                  android:fillColor="#D6AD45"
                  android:pathData="M31,24 H78 V36 H44 V47 H70 V59 H44 V84 H31 Z"/>
          </vector>
          """)

          (adaptive / "ic_launcher.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """)

          print("Flixora branding and launcher icon configured.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Fix app_settings compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path.home().glob(
              ".pub-cache/hosted/pub.dev/app_settings-*/android/build.gradle"
          ))
          files += list(Path.home().glob(
              ".pub-cache/hosted/pub.dev/app_settings-*/android/build.gradle.kts"
          ))

          if not files:
              raise SystemExit("ERROR: app_settings Gradle file not found")

          updated = False

          for file in files:
              content = file.read_text()

              new_content, count = re.subn(
                  r'compileSdkVersion\s+33',
                  'compileSdkVersion 36',
                  content
              )

              if count == 0:
                  new_content, count = re.subn(
                      r'compileSdk\s*=\s*33',
                      'compileSdk = 36',
                      content
                  )

              if count > 0:
                  file.write_text(new_content)
                  updated = True
                  print(f"Updated compileSdk to 36: {file}")
              else:
                  print(f"No matching API 33 setting found: {file}")

          if not updated:
              raise SystemExit("ERROR: Could not update app_settings compileSdk")
          PY

      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: flutter build apk --release --dart-define=TMDB_API_KEY="$TMDB_API_KEY" --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIXORA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
