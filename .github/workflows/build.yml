
name: Build FLIXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - design/white-gold-cinematic
      - feature/**
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flixora-apk-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build FLIXORA Rust playback core
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ANDROID_NDK_HOME"
          cargo test --manifest-path rust/flixora_core/Cargo.toml
          cd rust/flixora_core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../android/app/src/main/jniLibs build --release

      - name: Build SparkBoxCore MovieBox/WeFeed client
        env:
          SPARKBOX_CORE_REV: f4bc3c561a3eb723bf9c466159e04aae98f45d3c
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ANDROID_NDK_HOME"

          git init /tmp/SparkBoxCore
          git -C /tmp/SparkBoxCore remote add origin https://github.com/devfahim00/SparkBoxCore.git
          git -C /tmp/SparkBoxCore fetch --depth 1 origin "$SPARKBOX_CORE_REV"
          git -C /tmp/SparkBoxCore checkout --detach FETCH_HEAD

          # Keep the upstream core's guest-client region aligned with FLIXORA's
          # Bangladesh audience while retaining its built-in H5 fallback.
          python3 - <<'PY'
          from pathlib import Path

          ffi_source = Path("/tmp/SparkBoxCore/sparkbox-ffi/src/lib.rs")
          ffi_content = ffi_source.read_text()
          old_import = "use sparkbox_core::{CoreError, MediaItem, MovieBoxClient, StreamKind};"
          new_import = "use sparkbox_core::{Config, CoreError, MediaItem, MovieBoxClient, StreamKind};"
          old_client = "CLIENT.get_or_init(MovieBoxClient::new)"
          new_client = """CLIENT.get_or_init(|| {
                  let mut config = Config::default();
                  config.region = "BD".to_string();
                  config.timezone = "Asia/Dhaka".to_string();
                  MovieBoxClient::with_config(config)
              })"""
          if old_import not in ffi_content or old_client not in ffi_content:
              raise SystemExit("SparkBoxCore FFI source changed; review the Bangladesh config patch.")
          ffi_content = ffi_content.replace(old_import, new_import, 1)
          ffi_content = ffi_content.replace(old_client, new_client, 1)
          ffi_source.write_text(ffi_content)

          # The upstream signer hard-codes India in x-client-info. Apply the
          # Config region/timezone to the signed mobile header as well.
          mobile_source = Path("/tmp/SparkBoxCore/sparkbox-core/src/mobile.rs")
          mobile_content = mobile_source.read_text()
          old_info = """        ins(
                      &mut h,
                      "x-client-info",
                      client_info(
                          v4,
                          &self.device_id,
                          if v4 {
                              self.config.client_info_v4.as_deref()
                          } else {
                              self.config.client_info_v3.as_deref()
                          },
                      ),
                  );"""
          new_info = """        let mut client_info_json: Value = serde_json::from_str(&client_info(
                      v4,
                      &self.device_id,
                      if v4 {
                          self.config.client_info_v4.as_deref()
                      } else {
                          self.config.client_info_v3.as_deref()
                      },
                  ))
                  .unwrap_or_else(|_| serde_json::json!({}));
                  if let Some(info) = client_info_json.as_object_mut() {
                      info.insert("region".into(), Value::String(self.config.region.clone()));
                      info.insert("timezone".into(), Value::String(self.config.timezone.clone()));
                  }
                  ins(&mut h, "x-client-info", client_info_json.to_string());"""
          if old_info not in mobile_content:
              raise SystemExit("SparkBoxCore mobile header source changed; review the Bangladesh header patch.")
          mobile_content = mobile_content.replace(old_info, new_info, 1)
          mobile_source.write_text(mobile_content)

          # Refresh expired H5 guest tokens on the actual play endpoint.
          # The upstream play call previously reused the token captured when
          # details opened, even after other calls had already refreshed it.
          h5_source = Path("/tmp/SparkBoxCore/sparkbox-core/src/h5.rs")
          h5_content = h5_source.read_text()
          old_play_request = """            if let Some(t) = &d.h5_token {
                          if !t.trim().is_empty() {
                              ins(&mut h, "authorization", format!("Bearer {t}"));
                          }
                      }
                      let r = self.http.get(&url).headers(h).send().await?;
                      let status = r.status().as_u16();
                      let text = r.text().await?;
                      let root = try_json(&text).unwrap_or_default();
                      let data = root.get("data").and_then(Value::as_object);"""
          new_play_request = """            let cached_token = self.h5_guest.lock().await.clone().or_else(|| d.h5_token.clone());
                      if let Some(t) = &cached_token {
                          if !t.trim().is_empty() {
                              ins(&mut h, "authorization", format!("Bearer {t}"));
                          }
                      }
                      let response = self.http.get(&url).headers(h.clone())
                          .timeout(std::time::Duration::from_secs(12))
                          .send().await?;
                      let mut status = response.status().as_u16();
                      let mut text = response.text().await?;
                      let mut root = try_json(&text).unwrap_or_default();
                      let has_streams = |value: &Map<String, Value>| {
                          let data = value.get("data").and_then(Value::as_object);
                          ["dash", "hls", "streams"].iter().any(|key| {
                              !get_arr(data.and_then(|d| d.get(*key))).is_empty()
                          })
                      };
                      if matches!(status, 400 | 401 | 441) || (status == 200 && !has_streams(&root)) {
                          if let Some(fresh_token) = self.h5_token(true).await? {
                              let mut retry_headers = h;
                              retry_headers.remove(reqwest::header::AUTHORIZATION);
                              ins(&mut retry_headers, "authorization", format!("Bearer {fresh_token}"));
                              let retry_response = self.http.get(&url).headers(retry_headers)
                                  .timeout(std::time::Duration::from_secs(12))
                                  .send().await?;
                              status = retry_response.status().as_u16();
                              text = retry_response.text().await?;
                              root = try_json(&text).unwrap_or_default();
                          }
                      }
                      let data = root.get("data").and_then(Value::as_object);"""
          if old_play_request not in h5_content:
              raise SystemExit("SparkBoxCore play request source changed; review the token-refresh patch.")
          h5_content = h5_content.replace(old_play_request, new_play_request, 1)

          # Stream URLs are required before playback; external caption lookups
          # are optional and could block the player for several extra requests.
          # Keep captions returned inline by the play endpoint.
          old_captions = "        let _ = self.load_captions(&cap_keys, &mut subtitles).await;"
          new_captions = "        // External caption enrichment is deferred; inline captions remain available."
          if old_captions not in h5_content:
              raise SystemExit("SparkBoxCore caption enrichment call changed; review the playback fast-path patch.")
          h5_content = h5_content.replace(old_captions, new_captions, 1)
          h5_source.write_text(h5_content)
          PY

          # Add the dedicated paginated Short TV catalogue. The regular home feed
          # only supplies a small preview row; this uses the same signed MovieBox
          # client and keeps the app independent of extra providers.
          python3 - <<'PY'
          from pathlib import Path

          client_path = Path("/tmp/SparkBoxCore/sparkbox-core/src/client.rs")
          client = client_path.read_text()
          client_anchor = "    // ---------------------------------------------------------------- search"
          client_method = """    // -------------------------------------------------------------- shorts

              /// Paginated Short TV catalogue from the dedicated WeFeed endpoint.
              pub async fn shorts_catalog(&self, max_pages: i64, per_page: i64) -> Result<SearchResult> {
                  self.shorts_catalog_impl(max_pages, per_page).await
              }

          """
          if client_anchor not in client:
              raise SystemExit("SparkBoxCore client search anchor changed; review Short TV integration.")
          client = client.replace(client_anchor, client_method + client_anchor, 1)
          client_path.write_text(client)

          mobile_path = Path("/tmp/SparkBoxCore/sparkbox-core/src/mobile.rs")
          mobile = mobile_path.read_text()
          old_models = "use crate::models::{HomeSection, SearchItem, Season};"
          new_models = "use crate::models::{HomeSection, MediaItem, SearchItem, SearchResult, Season};"
          if old_models not in mobile:
              raise SystemExit("SparkBoxCore mobile model imports changed; review Short TV integration.")
          mobile = mobile.replace(old_models, new_models, 1)

          helper_anchor = "impl MovieBoxClient {\n"
          helper = """fn parse_short_subject(raw: &Map<String, Value>, block_adult: bool) -> Option<MediaItem> {
              let mut subject = raw.clone();
              if !subject.contains_key("stills") {
                  if let Some(pre_video_cover) = subject.get("preVideoCover").cloned() {
                      subject.insert("stills".into(), pre_video_cover);
                  }
              }
              let mut item = parse_subject(&subject, "", block_adult)?;
              // Short TV catalogue entries can use the Short TV subject type
              // instead of the normal series type; they still expose seasons.
              item.is_series = item.is_series
                  || item.subject_type == 3
                  || item.subject_type == 7
                  || raw.get("isSeries").and_then(Value::as_bool).unwrap_or(false);
              Some(item)
          }

          """
          if helper_anchor not in mobile:
              raise SystemExit("SparkBoxCore mobile impl anchor changed; review Short TV integration.")
          mobile = mobile.replace(helper_anchor, helper + helper_anchor, 1)

          method_anchor = "    /// Mobile detail call: gives detailPath/detailUrl and the guest token used\n"
          method = """    /// Dedicated Short TV catalogue with the same channel/default filters as
              /// the app's Short TV tab. Fetches multiple pages in one signed session.
              pub(crate) async fn shorts_catalog_impl(
                  &self,
                  max_pages: i64,
                  per_page: i64,
              ) -> Result<SearchResult> {
                  let base = self.config.mobile_base.trim_end_matches('/');
                  let host = base
                      .trim_start_matches("https://")
                      .trim_start_matches("http://")
                      .trim_end_matches('/');
                  let token = self.guest_token().await?;

                  let filter_url = format!(
                      "{base}/wefeed-fm-bff/shorts/subject/filter-items?host={host}&tabId=7&filterItemVer=v3"
                  );
                  let mut filter_headers =
                      self.mobile_headers("GET", &filter_url, None, false, token.as_deref());
                  ins(&mut filter_headers, "x-play-mode", "2".into());
                  let filter_response = self.http.get(&filter_url).headers(filter_headers).send().await?;
                  if !filter_response.status().is_success() {
                      return Err(CoreError::Api(format!(
                          "Short TV filter request failed ({})",
                          filter_response.status()
                      )));
                  }
                  let filter_text = filter_response.text().await?;
                  let filter_root = try_json(&filter_text)
                      .ok_or_else(|| CoreError::Api("Short TV filters returned invalid JSON".into()))?;
                  let filter_data = filter_root
                      .get("data")
                      .and_then(Value::as_object)
                      .ok_or_else(|| CoreError::Api("Short TV filters are unavailable".into()))?;
                  let channel = get_arr(filter_data.get("typeList"))
                      .into_iter()
                      .next()
                      .ok_or_else(|| CoreError::Api("Short TV has no available channel".into()))?;
                  let channel_id = s(channel, "channelId");
                  if channel_id.is_empty() {
                      return Err(CoreError::Api("Short TV channel id is missing".into()));
                  }

                  let mut default_filters = Map::new();
                  for filter in get_arr(channel.get("items")) {
                      let filter_type = s(filter, "filterType");
                      if filter_type.is_empty() {
                          continue;
                      }
                      if let Some(range) = filter.get("rangeVals").and_then(Value::as_object) {
                          let min = as_i64(range.get("minVal")).unwrap_or(0);
                          let max = as_i64(range.get("maxVal")).unwrap_or(0);
                          default_filters.insert(
                              filter_type,
                              Value::Array(vec![
                                  Value::String(min.to_string()),
                                  Value::String(max.to_string()),
                              ]),
                          );
                      } else if let Some(first) =
                          get_arr(filter.get("filterValsV2")).into_iter().next()
                      {
                          if let Some(id) = first.get("id") {
                              default_filters.insert(filter_type, id.clone());
                          }
                      }
                  }

                  let safe_per_page = per_page.clamp(1, 50);
                  let safe_max_pages = max_pages.clamp(1, 12);
                  let list_url = format!(
                      "{base}/wefeed-fm-bff/shorts/subject/list?host={host}"
                  );
                  let block_adult = self.block_adult();
                  let mut all_items = Vec::new();
                  let mut has_more = false;

                  for page in 1..=safe_max_pages {
                      let mut payload = Map::new();
                      payload.insert("page".into(), Value::from(page));
                      payload.insert("perPage".into(), Value::from(safe_per_page));
                      payload.insert("channelId".into(), Value::String(channel_id.clone()));
                      for (key, value) in &default_filters {
                          payload.insert(key.clone(), value.clone());
                      }
                      let body = Value::Object(payload).to_string();
                      let mut headers =
                          self.mobile_headers("POST", &list_url, Some(&body), false, token.as_deref());
                      ins(&mut headers, "x-play-mode", "2".into());
                      let response = self
                          .http
                          .post(&list_url)
                          .headers(headers)
                          .body(body)
                          .send()
                          .await?;
                      if !response.status().is_success() {
                          return Err(CoreError::Api(format!(
                              "Short TV page {page} failed ({})",
                              response.status()
                          )));
                      }
                      let text = response.text().await?;
                      let root = try_json(&text)
                          .ok_or_else(|| CoreError::Api("Short TV page returned invalid JSON".into()))?;
                      let data = root
                          .get("data")
                          .and_then(Value::as_object)
                          .ok_or_else(|| CoreError::Api("Short TV catalogue is unavailable".into()))?;
                      let raw_items = get_arr(data.get("items"));
                      let item_count = raw_items.len();
                      for raw in raw_items {
                          if let Some(item) = parse_short_subject(raw, block_adult) {
                              all_items.push(item);
                          }
                      }
                      has_more = data
                          .get("pager")
                          .and_then(Value::as_object)
                          .and_then(|pager| pager.get("hasMore"))
                          .and_then(Value::as_bool)
                          .unwrap_or(item_count as i64 >= safe_per_page);
                      if item_count == 0 || !has_more {
                          break;
                      }
                  }

                  Ok(SearchResult {
                      items: all_items,
                      has_more,
                  })
              }

          """
          if method_anchor not in mobile:
              raise SystemExit("SparkBoxCore mobile detail anchor changed; review Short TV integration.")
          mobile = mobile.replace(method_anchor, method + method_anchor, 1)

          # Keep a regression test for Short TV's alternate series subject type.
          test_module = """#[cfg(test)]
          mod shorts_catalog_tests {
              use super::*;
              use serde_json::json;

              #[test]
              fn short_tv_subject_type_three_is_episode_based_series() {
                  let raw = json!({
                      "subjectId": "short-series-1",
                      "title": "Example Short Series",
                      "subjectType": 3,
                      "releaseDate": "2026-01-01",
                      "cover": { "url": "https://cdn.example.test/poster.jpg" },
                      "preVideoCover": { "url": "https://cdn.example.test/backdrop.jpg" }
                  });
                  let item = parse_short_subject(raw.as_object().unwrap(), false).expect("short TV item parses");
                  assert!(item.is_series);
                  assert_eq!(item.subject_type, 3);
                  assert_eq!(item.backdrop, "https://cdn.example.test/backdrop.jpg");
              }

              #[test]
              fn short_tv_subject_type_seven_is_also_episode_based_series() {
                  let raw = json!({
                      "subjectId": "short-series-7",
                      "title": "Example Short Series 7",
                      "subjectType": 7,
                      "cover": { "url": "https://cdn.example.test/poster.jpg" }
                  });
                  let item = parse_short_subject(raw.as_object().unwrap(), false).expect("short TV item parses");
                  assert!(item.is_series);
                  assert_eq!(item.subject_type, 7);
              }
          }

          """
          if "mod shorts_catalog_tests" not in mobile:
              mobile += "\n" + test_module
          # Short TV's own detail and season endpoints include the resolved host
          # query parameter. Keep it on the shared MovieBox calls as well.
          old_seasons = """        let url = format!(
                      "{}/wefeed-mobile-bff/subject-api/season-info?subjectId={}",
                      self.config.mobile_base, subject_id
                  );"""
          new_seasons = """        let base = self.config.mobile_base.trim_end_matches('/');
                  let host = base
                      .trim_start_matches("https://")
                      .trim_start_matches("http://")
                      .trim_end_matches('/');
                  let url = format!(
                      "{base}/wefeed-mobile-bff/subject-api/season-info?host={host}&subjectId={subject_id}"
                  );"""
          if old_seasons not in mobile:
              raise SystemExit("SparkBoxCore season-info URL changed; review Short TV episode support.")
          mobile = mobile.replace(old_seasons, new_seasons, 1)

          old_season_headers = """        let text = self
                      .http
                      .get(&url)
                      .headers(self.mobile_headers("GET", &url, None, false, token.as_deref()))
                      .send()
                      .await?
                      .text()
                      .await?;"""
          new_season_headers = """        let mut headers =
                      self.mobile_headers("GET", &url, None, false, token.as_deref());
                  ins(&mut headers, "x-play-mode", "2".into());
                  let text = self
                      .http
                      .get(&url)
                      .headers(headers)
                      .send()
                      .await?
                      .text()
                      .await?;"""
          if old_season_headers not in mobile:
              raise SystemExit("SparkBoxCore season-info headers changed; review Short TV episode support.")
          mobile = mobile.replace(old_season_headers, new_season_headers, 1)

          old_signature = """    pub(crate) async fn detail_mobile(
                  &self,
                  id: &str,
                  path_hint: &str,
              ) -> Result<crate::models::Detail> {"""
          new_signature = """    pub(crate) async fn detail_mobile(
                  &self,
                  id: &str,
                  path_hint: &str,
                  subject_type: i64,
              ) -> Result<crate::models::Detail> {"""
          if old_signature not in mobile:
              raise SystemExit("SparkBoxCore detail_mobile signature changed; review Short TV support.")
          mobile = mobile.replace(old_signature, new_signature, 1)

          old_detail = """        let url = format!(
                      "{}/wefeed-mobile-bff/subject-api/get?subjectId={}",
                      self.config.mobile_base, id
                  );"""
          new_detail = """        let base = self.config.mobile_base.trim_end_matches('/');
                  let host = base
                      .trim_start_matches("https://")
                      .trim_start_matches("http://")
                      .trim_end_matches('/');
                  let url = format!(
                      "{base}/wefeed-mobile-bff/subject-api/get?host={host}&subjectId={id}&subjectType={subject_type}"
                  );"""
          if old_detail not in mobile:
              raise SystemExit("SparkBoxCore subject detail URL changed; review Short TV playback support.")
          mobile = mobile.replace(old_detail, new_detail, 1)
          mobile_path.write_text(mobile)

          client_path = Path("/tmp/SparkBoxCore/sparkbox-core/src/client.rs")
          client = client_path.read_text()
          old_client_call = 'self.detail_mobile(item.id.as_str(), "").await'
          new_client_call = 'self.detail_mobile(item.id.as_str(), "", item.subject_type).await'
          if old_client_call not in client:
              raise SystemExit("SparkBoxCore play_detail call changed; review Short TV support.")
          client_path.write_text(client.replace(old_client_call, new_client_call, 1))

          h5_path = Path("/tmp/SparkBoxCore/sparkbox-core/src/h5.rs")
          h5 = h5_path.read_text()
          old_h5_call = 'self.detail_mobile(&item.id, "").await'
          new_h5_call = 'self.detail_mobile(&item.id, "", item.subject_type).await'
          if old_h5_call not in h5:
              raise SystemExit("SparkBoxCore detail_rich call changed; review Short TV support.")
          h5_path.write_text(h5.replace(old_h5_call, new_h5_call, 1))

          parse_path = Path("/tmp/SparkBoxCore/sparkbox-core/src/parse.rs")
          parse_source = parse_path.read_text()
          old_parse_season = """pub fn parse_season(o: &Map<String, Value>) -> Option<Season> {
              let se = as_i64(o.get("se"))?;
              if se < 0 {
                  return None;
              }
              let mut listed: Vec<i64> = s(o, "allEp")
                  .split([',', ';', ' '])
                  .filter_map(|t| t.trim().parse::<i64>().ok())
                  .collect();
              listed.sort_unstable();
              listed.dedup();
              let max_ep = as_i64(o.get("maxEp")).unwrap_or(0);
              let episodes = if !listed.is_empty() {
                  listed
              } else {
                  (1..=max_ep.max(0)).collect()
              };
              if episodes.is_empty() {
                  return None;
              }
              let max = *episodes.iter().max().unwrap();
              Some(Season {
                  se,
                  max_ep: max,
                  episodes,
              })
          }"""
          new_parse_season = """pub fn parse_season(o: &Map<String, Value>) -> Option<Season> {
              let se = as_i64(o.get("se"))
                  .or_else(|| as_i64(o.get("season")))
                  .or_else(|| as_i64(o.get("seasonNumber")))?;
              if se < 0 {
                  return None;
              }
              let mut listed: Vec<i64> = s(o, "allEp")
                  .split([',', ';', ' '])
                  .filter_map(|t| t.trim().parse::<i64>().ok())
                  .collect();
              if listed.is_empty() {
                  if let Some(raw_episodes) = o.get("episodes").and_then(Value::as_array) {
                      for raw in raw_episodes {
                          let episode = as_i64(Some(raw))
                              .or_else(|| as_i64(raw.get("ep")))
                              .or_else(|| as_i64(raw.get("episode")))
                              .or_else(|| as_i64(raw.get("episodeNumber")))
                              .or_else(|| as_i64(raw.get("number")));
                          if let Some(number) = episode {
                              if number > 0 {
                                  listed.push(number);
                              }
                          }
                      }
                  }
              }
              listed.sort_unstable();
              listed.dedup();
              let max_ep = as_i64(o.get("maxEp"))
                  .or_else(|| as_i64(o.get("totalEpisode")))
                  .unwrap_or(0);
              let episodes = if !listed.is_empty() {
                  listed
              } else {
                  (1..=max_ep.max(0)).collect()
              };
              if episodes.is_empty() {
                  return None;
              }
              let max = *episodes.iter().max().unwrap();
              Some(Season {
                  se,
                  max_ep: max,
                  episodes,
              })
          }"""
          if old_parse_season not in parse_source:
              raise SystemExit("SparkBoxCore parse_season changed; review Short TV episode parsing.")
          parse_source = parse_source.replace(old_parse_season, new_parse_season, 1)
          parse_test = """#[cfg(test)]
          mod short_tv_season_tests {
              use super::*;
              use serde_json::json;

              #[test]
              fn parses_short_tv_episode_object_lists() {
                  let raw = json!({
                      "seasonNumber": 2,
                      "episodes": [
                          { "ep": 3 },
                          { "episodeNumber": 1 },
                          2
                      ]
                  });
                  let season = parse_season(raw.as_object().unwrap()).expect("season parses");
                  assert_eq!(season.se, 2);
                  assert_eq!(season.episodes, vec![1, 2, 3]);
              }
          }

          """
          if "mod short_tv_season_tests" not in parse_source:
              parse_source += "\n" + parse_test
          parse_path.write_text(parse_source)

          h5_path.write_text(h5.replace(old_h5_call, new_h5_call, 1))

          ffi_path = Path("/tmp/SparkBoxCore/sparkbox-ffi/src/lib.rs")
          ffi = ffi_path.read_text()
          ffi_anchor = "/// Search suggestions → `Vec<String>`.\n"
          ffi_function = """/// Dedicated Short TV catalogue returning items and a hasMore flag.
          #[no_mangle]
          pub extern "C" fn sparkbox_shorts(per_page: c_int, max_pages: c_int) -> *mut c_char {
              guard(|| match rt().block_on(client().shorts_catalog(max_pages as i64, per_page as i64)) {
                  Ok(res) => ok(&res),
                  Err(e) => err(&e),
              })
          }

          """
          if ffi_anchor not in ffi:
              raise SystemExit("SparkBoxCore FFI search anchor changed; review Short TV integration.")
          ffi = ffi.replace(ffi_anchor, ffi_function + ffi_anchor, 1)
          ffi_path.write_text(ffi)
          PY

          cd /tmp/SparkBoxCore
          cargo test --workspace --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs" \
            build --release -p sparkbox-ffi --locked

          test -s "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsparkbox_ffi.so"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/armeabi-v7a/libsparkbox_ffi.so"
          test -s "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/x86_64/libsparkbox_ffi.so"

      - name: Check environment
        run: |
          flutter --version
          java -version
          flutter doctor -v

      - name: Validate project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f assets/app_icon.png

      - name: Configure Flixora Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="Flixora"',
              content,
              count=1
          )

          if 'android.permission.INTERNET' not in content:
              content = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  content,
                  count=1
              )

          manifest.write_text(content)
          print("Flixora Android configuration completed.")
          PY

      - name: Clean Flutter project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate FLIXORA App Icon
        run: dart run flutter_launcher_icons

      - name: Verify dependencies
        run: flutter pub deps

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Analyze Flutter project
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Configure persistent FLIXORA release signing
        env:
          FLIXORA_KEYSTORE_BASE64: ${{ secrets.FLIXORA_KEYSTORE_BASE64 }}
          FLIXORA_KEYSTORE_PASSWORD: ${{ secrets.FLIXORA_KEYSTORE_PASSWORD }}
          FLIXORA_KEY_ALIAS: ${{ secrets.FLIXORA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$FLIXORA_KEYSTORE_BASE64" ] || [ -z "$FLIXORA_KEYSTORE_PASSWORD" ] || [ -z "$FLIXORA_KEY_ALIAS" ]; then
            echo "Missing FLIXORA signing secrets. Add FLIXORA_KEYSTORE_BASE64, FLIXORA_KEYSTORE_PASSWORD and FLIXORA_KEY_ALIAS in repository Actions secrets."
            exit 1
          fi

          printf '%s' "$FLIXORA_KEYSTORE_BASE64" | base64 --decode > android/app/flixora-upload-key.jks
          test -s android/app/flixora-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$FLIXORA_KEYSTORE_PASSWORD
          keyPassword=$FLIXORA_KEYSTORE_PASSWORD
          keyAlias=$FLIXORA_KEY_ALIAS
          storeFile=flixora-upload-key.jks
          EOF

          echo "Persistent FLIXORA release signing configured."

      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DAILYMOTION_PLAYER_ID: ${{ secrets.DAILYMOTION_PLAYER_ID }}
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          for attempt in 1 2 3; do
            echo "Starting APK build attempt $attempt of 3"

            if flutter build apk --release \
              --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
              --dart-define=DAILYMOTION_PLAYER_ID="$DAILYMOTION_PLAYER_ID"; then
              echo "APK build successful."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Waiting before retry..."
              sleep 30
            fi
          done

          echo "APK build failed after 3 attempts."
          exit 1

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FLIXORA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
