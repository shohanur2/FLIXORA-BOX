
name: Build FLIXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle Cache
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # 5. Check environment
      - name: Check Flutter
        run: |
          flutter --version
          java -version
          flutter doctor -v

      # 6. Validate project files
      - name: Validate project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f assets/app_icon.png

      # 7. Configure app name and Internet permission
      - name: Configure Flixora Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="Flixora"',
              content,
              count=1
          )

          if 'android.permission.INTERNET' not in content:
              content = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  content,
                  count=1
              )

          manifest.write_text(content)
          print("Flixora Android configuration completed.")
          PY

      # 8. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 9. Generate Premium App Icon
      - name: Generate FLIXORA App Icon
        run: dart run flutter_launcher_icons

      # 10. Verify dependencies
      - name: Verify dependencies
        run: flutter pub deps

      # 11. Analyze Flutter project
      - name: Analyze Flutter project
        continue-on-error: true
        run: flutter analyze --no-pub

      # 12. Build release APK with retry
      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          for attempt in 1 2 3; do
            echo "Starting APK build attempt $attempt of 3"

            if flutter build apk --release \
              --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"; then
              echo "APK build successful."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Waiting before retry..."
              sleep 30
            fi
          done

          echo "APK build failed after 3 attempts."
          exit 1

      # 13. Verify APK
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIXORA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
