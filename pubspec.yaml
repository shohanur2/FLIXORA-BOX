
name: flixora
description: Flixora - Premium Cinematic Movie App
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  path_provider: ^2.1.4
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.1
  app_settings: ^5.1.1

  # Premium Video Player
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
