name: flixora
description: Flixora - Premium All-in-One Entertainment App
publish_to: 'none'

version: 1.0.9+12

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Images and Fonts
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  google_fonts: ^6.2.1
  share_plus: ^10.1.4

  # Storage and Downloads
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Backend
  supabase_flutter: ^2.13.0

  # Video Player
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  video_player: ^2.9.2
  webview_flutter: ^4.13.1
  webview_flutter_android: 4.10.1

  # Device Settings
  app_settings: ^5.1.1
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/flixora_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
